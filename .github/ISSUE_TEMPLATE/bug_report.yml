name: Bug report
description: Something on quantumorb.app or in this repository looks wrong or does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A security problem? Please do not describe it here: see SECURITY.md.
        QuantumOrb never asks for keys, seed phrases or funds.
  - type: input
    id: where
    attributes:
      label: Where
      description: The page, the token address you scanned, or the file in this repository
      placeholder: https://quantumorb.app/#t-…, a token address, or rules/score.js
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scan and score
        - Token page (market, owner powers, liquidity, first buyers, Guard)
        - Radar and Shield
        - Telegram bot
        - The open code in this repository
        - Something else
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Windows, Safari on iPhone…
